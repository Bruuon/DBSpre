<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>芝加哥犯罪数据分析平台</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://d3js.org/d3-scale-chromatic.v3.min.js"></script>
</head>
<body>

<div class="header">
    <h1 style="margin: 0;">芝加哥犯罪数据分析平台</h1>
</div>

<div class="nav-tabs">
    <div class="nav-tab active" data-view="trend">年度演变趋势 (折线图)</div>
    <div class="nav-tab" data-view="weekly">一周分布规律 (柱状图)</div>
    <div class="nav-tab" data-view="hourly">24小时分布规律 (面积图)</div>
    <div class="nav-tab" data-view="heatmap">空间分布热力图 (地图)</div>
    <div class="nav-tab" data-view="arrest">不同类型犯罪的逮捕率差异</div>
    <div class="nav-tab" data-view="school">学校相关犯罪分析 (嵌套环形图)</div>
    <div class="nav-tab" data-view="matrix">时间×类型×逮捕率 (矩阵气泡)</div>
    <div class="nav-tab" data-view="radar">警区犯罪画像 (多维雷达图)</div>
</div>

<div class="main-content">
    <div class="controls">
        <label for="crime-type-select"><strong>聚焦特定犯罪类型：</strong></label>
        <select id="crime-type-select">
            <option value="ALL">全部犯罪总数 (ALL)</option>
            <option value="THEFT">盗窃 (THEFT)</option>
            <option value="BATTERY">殴打/人身攻击 (BATTERY)</option>
            <option value="CRIMINAL DAMAGE">刑事破坏 (CRIMINAL DAMAGE)</option>
            <option value="NARCOTICS">毒品犯罪 (NARCOTICS)</option>
            <option value="ASSAULT">蓄意伤害 (ASSAULT)</option>
            <option value="BURGLARY">入室盗窃 (BURGLARY)</option>
            <option value="MOTOR VEHICLE THEFT">机动车盗窃 (MOTOR VEHICLE THEFT)</option>
            <option value="ROBBERY">抢劫 (ROBBERY)</option>
            <option value="DECEPTIVE PRACTICE">欺诈行为 (DECEPTIVE PRACTICE)</option>
            <option value="WEAPONS VIOLATION">武器违规 (WEAPONS VIOLATION)</option>
        </select>
    </div>

    <h3 id="chart-title">数据初始化中...</h3>
    <div class="chart-container">
        <div class="loading" id="loading-spinner">数据查询中，请稍候...</div>
        <div id="chart-area"></div>
    </div>
</div>

<div id="tooltip" class="tooltip"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
